<!DOCTYPE html>

<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dicionário de Rimas PRO+</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #f4f6f8;
  display: flex;
  justify-content: center;
}

.main { max-width: 900px; width: 100%; padding: 20px; }

.box {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  background: linear-gradient(135deg, #3498db, #6dd5fa);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.tag {
  display: inline-block;
  padding: 6px 10px;
  margin: 4px;
  border-radius: 6px;
  background: #ecf0f1;
  cursor: pointer;
}

.tag:hover { background: #3498db; color: white; }

.group-title {
  margin-top: 15px;
  font-weight: bold;
  color: #2c3e50;
}
</style>

<script src="rimas.js"></script>

</head>

<body>

<div class="main">
<div class="box">

<h2>🎵 Dicionário de Rimas PRO+</h2>

<input id="palavra" placeholder="Ex: coração">

<select id="modo">
<option value="fonetico">Rima fonética</option>
<option value="terminacao">Por terminação</option>
</select>

<select id="tamanho">
<option value="2">2</option>
<option value="3" selected>3</option>
<option value="4">4</option>
<option value="5">5</option>
</select>

<button onclick="buscar()">Procurar</button>

<div id="info"></div>
<div id="res"></div>

</div>
</div>

<script>
let palavras = [];

function normalizar(txt) {
  return txt.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function inicializar() {
  palavras = (typeof base_palavras !== "undefined" ? base_palavras : [
    "coração","paixão","emoção","canção","razão","visão",
    "andar","cantar","amar","altar","lugar","brilhar"
  ]).map(p => p.toLowerCase());
}

// 🔊 detectar sílaba tónica (heurística PT)
function tipoTonica(p) {
  if (/[áéíóúâêôãõ]$/.test(p)) return "oxítona";
  if (p.length <= 3) return "oxítona";
  if (/[aeiou]s$/.test(p)) return "paroxítona";
  return "paroxítona";
}

// 🔊 transformação fonética simplificada
function fonetizar(p) {
  p = normalizar(p);

  return p
    .replace(/cao/g,"sao")
    .replace(/ção/g,"sao")
    .replace(/lh/g,"li")
    .replace(/nh/g,"ni");
}

// extrair parte da rima
function parteRima(p) {
  p = fonetizar(p);
  const vogais = "aeiou";
  let i = p.length - 1;

  while (i >= 0 && !vogais.includes(p[i])) i--;
  return p.slice(i - 1);
}

function buscar() {
  const input = document.getElementById("palavra").value.toLowerCase().trim();
  const modo = document.getElementById("modo").value;
  const tam = parseInt(document.getElementById("tamanho").value);

  const res = document.getElementById("res");
  const info = document.getElementById("info");

  if (!input) return res.innerHTML = "Escreve uma palavra.";

  const base = normalizar(input);
  const tonica = tipoTonica(input);

  info.innerHTML = `Sílaba tónica: <b>${tonica}</b>`;

  let perfeitas = [];
  let aproximadas = [];

  palavras.forEach(p => {
    if (p === base) return;

    if (modo === "terminacao") {
      const suf = base.slice(-tam);
      if (p.endsWith(suf)) perfeitas.push(p);
      return;
    }

    const r1 = parteRima(base);
    const r2 = parteRima(p);

    if (r1 === r2) {
      perfeitas.push(p);
    } else if (r2.endsWith(r1.slice(-2))) {
      aproximadas.push(p);
    }
  });

  let html = "";

  if (perfeitas.length) {
    html += `<div class="group-title">Rimas perfeitas (${perfeitas.length})</div>`;
    html += perfeitas.map(p => `<span class="tag" onclick="clicar('${p}')">${p}</span>`).join("");
  }

  if (aproximadas.length) {
    html += `<div class="group-title">Rimas aproximadas (${aproximadas.length})</div>`;
    html += aproximadas.map(p => `<span class="tag" onclick="clicar('${p}')">${p}</span>`).join("");
  }

  if (!html) html = "Sem rimas.";

  res.innerHTML = html;
}

function clicar(p) {
  document.getElementById("palavra").value = p;
  buscar();
}

inicializar();
</script>

</body>
</html>
